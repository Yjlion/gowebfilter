# systemd drop-in: let webfilter run TUN capture without running as root.
#
# Install as (run mode):
#   /etc/systemd/system/webfilter.service.d/10-tun2socks.conf
# or (split mode - only the proxy unit supervises tun2socks; `webfilter mgmt`
# supervises nothing, so it must NOT get this):
#   /etc/systemd/system/webfilter-proxy.service.d/10-tun2socks.conf
#
# packaging/install.sh installs this automatically when settings.json has
# tun2socks enabled (force it with --tun2socks). After installing by hand, run
# `systemctl daemon-reload` and restart the unit.
#
# Why each capability:
#   CAP_NET_ADMIN - `ip tuntap add` / `ip addr` / `ip link` / `ip route` in
#     internal/tun2socks/platform_linux.go, and the tun2socks child's TUNSETIFF
#     on /dev/net/tun.
#   CAP_NET_RAW   - SO_BINDTODEVICE, which tun2socks uses when
#     tun2socks.interface_name is set (it passes --interface) to keep its own
#     upstream sockets out of the TUN it just routed traffic into. Safe to drop
#     this one if interface_name is empty.
#
# These are *ambient* capabilities, which is what makes the design work: they
# survive execve, so both the `ip` calls and the tun2socks child inherit them,
# and NoNewPrivileges=true does not block them. `setcap` on bin/tun2socks would
# NOT work - NoNewPrivileges=true disables file capabilities, and it is the
# webfilter process, not the child, that runs `ip`.
#
# /dev/net/tun stays reachable: ProtectSystem=strict exempts /dev. Do not add
# PrivateDevices=yes, which replaces /dev with a minimal set that has no tun.
#
# Security note: with this drop-in the filtering engine itself holds these two
# capabilities for its lifetime, rather than only the tun2socks child being
# privileged. That is still a far smaller grant than User=root, and it is the
# only option compatible with NoNewPrivileges=true. See packaging/README.md.
[Service]
# The empty assignment resets the merged list so this file is the only source.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
PrivateDevices=no
